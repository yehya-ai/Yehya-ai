    <div class="page-top-space"></div>

    <div class="container py-5">
      <div class="generator-card">
        <div class="generator-header">
          <h1 class="text-warning">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            مولد البرومبت الاحترافي
          </h1>

          <p class="mb-0">
            اختر العناصر المطلوبة وسيتم إنشاء برومبت احترافي جاهز للنسخ
          </p>
        </div>

        <div class="generator-body">
          <form id="promptForm">
            <div class="row g-4">
              <div class="col-md-4 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-layer-group text-warning me-2"></i>
                  نوع المحتوى
                </label>
                <select id="contentType" class="form-select">
                  <option value="image prompt">صورة</option>
                  <option value="video prompt">فيديو</option>
                  <option value="advertisement design">إعلان</option>
                  <option value="character design">شخصية</option>
                </select>
              </div>

              <div class="col-md-4 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-shapes text-warning me-2"></i>
                  العنصر الأساسي
                </label>
                <select id="subject" class="form-select">
                  <option value="cute talking banana">موزة تتحدث</option>
                  <option value="cute talking panda">باندا تتحدث</option>
                  <option value="young Arab man">شاب عربي</option>
                  <option value="beautiful Arab woman">امرأة عربية</option>
                  <option value="cute cartoon boy">طفل كرتوني</option>
                  <option value="luxury product">منتج فاخر</option>
                </select>
              </div>

              <div class="col-md-4 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-palette text-warning me-2"></i>
                  الأسلوب
                </label>
                <select id="style" class="form-select">
                  <option value="Pixar style">Pixar</option>
                  <option value="cartoon style">كرتون</option>
                  <option value="realistic style">واقعي</option>
                  <option value="anime style">أنمي</option>
                  <option value="cinematic style">سينمائي</option>
                </select>
              </div>

              <div class="col-md-4 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-lightbulb text-warning me-2"></i>
                  الإضاءة
                </label>
                <select id="lighting" class="form-select">
                  <option value="cinematic lighting">سينمائية</option>
                  <option value="soft lighting">ناعمة</option>
                  <option value="dramatic lighting">درامية</option>
                  <option value="golden hour lighting">غروب</option>
                  <option value="studio lighting">استوديو</option>
                </select>
              </div>

              <div class="col-md-4 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-camera text-warning me-2"></i>
                  زاوية التصوير
                </label>
                <select id="camera" class="form-select">
                  <option value="close-up shot">قريبة</option>
                  <option value="medium shot">متوسطة</option>
                  <option value="wide shot">واسعة</option>
                  <option value="front view">أمامية</option>
                  <option value="top view">من الأعلى</option>
                </select>
              </div>

              <div class="col-md-4 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-image text-warning me-2"></i>
                  الخلفية
                </label>
                <select id="background" class="form-select">
                  <option value="in a colorful park">حديقة ملونة</option>
                  <option value="in a modern office">مكتب حديث</option>
                  <option value="in a bright playground">ساحة لعب</option>
                  <option value="in a luxury studio background">
                    استوديو فاخر
                  </option>
                  <option value="in a tropical setting">خلفية استوائية</option>
                </select>
              </div>

              <div class="col-md-6 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-face-smile text-warning me-2"></i>
                  المشاعر
                </label>
                <select id="mood" class="form-select">
                  <option value="happy and playful mood">مرح وسعيد</option>
                  <option value="professional and elegant mood">
                    احترافي وأنيق
                  </option>
                  <option value="funny and energetic mood">مضحك وحيوي</option>
                  <option value="cute and friendly mood">لطيف وودود</option>
                  <option value="dramatic and powerful mood">قوي ودرامي</option>
                </select>
              </div>

              <div class="col-md-6 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-gem text-warning me-2"></i>
                  مستوى الجودة
                </label>
                <select id="quality" class="form-select">
                  <option value="highly detailed">تفاصيل عالية</option>
                  <option value="ultra detailed, 4K">4K</option>
                  <option value="ultra realistic, high quality">
                    جودة عالية جداً
                  </option>
                  <option value="professional composition">
                    تكوين احترافي
                  </option>
                </select>
              </div>

              <div class="col-12 form-label">
                <label class="form-label text-dark">
                  <i class="fa-solid fa-pen text-warning me-2"></i>
                  تفاصيل إضافية
                </label>
                <input
                  type="text"
                  id="extraDetails"
                  class="form-control"
                  placeholder="مثال:  expressive eyes, smiling face, tiny arms and legs"
                />
              </div>
            </div>
          </form>

          <div class="generator-actions">
            <button
              type="button"
              class="btn btn-warning btn-lg"
              onclick="generatePrompt()"
            >
              <i class="fa-solid fa-bolt"></i>
              توليد البرومبت
            </button>

            <button
              type="button"
              class="btn btn-dark btn-lg"
              onclick="copyPrompt()"
            >
              <i class="fa-regular fa-copy"></i>
              نسخ
            </button>

            <button
              type="button"
              class="btn btn-secondary btn-lg"
              onclick="clearPrompt()"
            >
              <i class="fa-solid fa-trash"></i>
              مسح
            </button>

            <button
              type="button"
              class="btn btn-outline-warning btn-lg"
              onclick="randomPrompt()"
            >
              <i class="fa-solid fa-shuffle"></i>
              عشوائي
            </button>
          </div>

          <div class="prompt-output" id="resultBox">
            <span class="mini-badge">النتيجة</span>
            <div id="resultText">سيظهر البرومبت هنا...</div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer py-4 mt-5">
      <div
        class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-3"
      >
        <div class="fw-bold">
          © <span id="year"></span> Yehya AI — استكشف قوة الذكاء الاصطناعي.
        </div>
      </div>
    </footer>

    <script src="bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    <script>
      function generatePrompt() {
        const contentType = document.getElementById("contentType").value;
        const subject = document.getElementById("subject").value;
        const style = document.getElementById("style").value;
        const lighting = document.getElementById("lighting").value;
        const camera = document.getElementById("camera").value;
        const background = document.getElementById("background").value;
        const mood = document.getElementById("mood").value;
        const quality = document.getElementById("quality").value;
        const extraDetails = document
          .getElementById("extraDetails")
          .value.trim();

        let prompt = `${contentType} of ${subject}, ${style}, ${lighting}, ${camera}, ${background}, ${mood}, ${quality}`;

        if (extraDetails) {
          prompt += `, ${extraDetails}`;
        }

        prompt += `, vibrant colors, clean composition`;

        document.getElementById("resultText").textContent = prompt;
      }

      function copyPrompt() {
        const text = document.getElementById("resultText").textContent;

        if (text === "سيظهر البرومبت هنا..." || text.trim() === "") {
          alert("قم بتوليد برومبت أولاً");
          return;
        }

        navigator.clipboard.writeText(text).then(() => {
          alert("تم نسخ البرومبت");
        });
      }

      function randomPrompt() {
        const contentTypes = [
          "image prompt",
          "video prompt",
          "advertisement design",
          "character design",
        ];

        const subjects = [
          "cute talking banana",
          "cute talking panda",
          "young Arab man",
          "beautiful Arab woman",
          "cute cartoon boy",
          "luxury product",
        ];

        const styles = [
          "Pixar style",
          "cartoon style",
          "realistic style",
          "anime style",
          "cinematic style",
        ];

        const lightings = [
          "cinematic lighting",
          "soft lighting",
          "dramatic lighting",
          "golden hour lighting",
          "studio lighting",
        ];

        const cameras = [
          "close-up shot",
          "medium shot",
          "wide shot",
          "front view",
          "top view",
        ];

        const backgrounds = [
          "in a colorful park",
          "in a modern office",
          "in a bright playground",
          "in a luxury studio background",
          "in a tropical setting",
        ];

        const moods = [
          "happy and playful mood",
          "professional and elegant mood",
          "funny and energetic mood",
          "cute and friendly mood",
          "dramatic and powerful mood",
        ];

        const qualities = [
          "highly detailed",
          "ultra detailed, 4K",
          "ultra realistic, high quality",
          "professional composition",
        ];

        const random = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const randomContentType = random(contentTypes);
        const randomSubject = random(subjects);
        const randomStyle = random(styles);
        const randomLighting = random(lightings);
        const randomCamera = random(cameras);
        const randomBackground = random(backgrounds);
        const randomMood = random(moods);
        const randomQuality = random(qualities);

        document.getElementById("contentType").value = randomContentType;
        document.getElementById("subject").value = randomSubject;
        document.getElementById("style").value = randomStyle;
        document.getElementById("lighting").value = randomLighting;
        document.getElementById("camera").value = randomCamera;
        document.getElementById("background").value = randomBackground;
        document.getElementById("mood").value = randomMood;
        document.getElementById("quality").value = randomQuality;
        document.getElementById("extraDetails").value = "";

        const prompt = `${randomContentType} of ${randomSubject}, ${randomStyle}, ${randomLighting}, ${randomCamera}, ${randomBackground}, ${randomMood}, ${randomQuality}, vibrant colors, clean composition`;

        document.getElementById("resultText").textContent = prompt;
      }

      function clearPrompt() {
        const form = document.getElementById("promptForm");

        if (form) {
          form.reset();
        }

        document.getElementById("resultText").textContent =
          "سيظهر البرومبت هنا...";
      }
    </script>
  </body>
